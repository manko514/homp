# DO NOT commit real values — replace every <base64-encoded-value> placeholder.
# Generate with: echo -n 'your-value' | base64
#
# Apply with:
#   kubectl apply -f k8s/secrets.yaml
#
# Or use Sealed Secrets / External Secrets Operator for production.
apiVersion: v1
kind: Secret
metadata:
  name: homp-secrets
  namespace: homp
type: Opaque
data:
  DATABASE_URL: <base64-encoded-value>
  JWT_SECRET: <base64-encoded-value>
  REDIS_URL: <base64-encoded-value>
  ANTHROPIC_API_KEY: <base64-encoded-value>
  FIREBASE_PROJECT_ID: <base64-encoded-value>
  FIREBASE_CLIENT_EMAIL: <base64-encoded-value>
  FIREBASE_PRIVATE_KEY: <base64-encoded-value>
