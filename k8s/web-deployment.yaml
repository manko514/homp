apiVersion: apps/v1
kind: Deployment
metadata:
  name: homp-web
  namespace: homp
  labels:
    app: homp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homp-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: homp-web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/homp/web:latest   # replace with your registry
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_API_URL
              value: http://homp-api:3001   # in-cluster service DNS
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: homp-web
  namespace: homp
spec:
  selector:
    app: homp-web
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
